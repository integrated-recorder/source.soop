[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "soop-native-grid-poc"
version = "0.1.0"
description = "Standalone experimental SOOP native TCP Grid Streamlink plugin"
requires-python = ">=3.10"
dependencies = ["streamlink>=8.6.2,<9"]
license = "AGPL-3.0-only"
license-files = ["LICENSE"]

[project.optional-dependencies]
test = ["pytest>=8", "ruff>=0.12"]

[tool.setuptools.packages.find]
include = ["soop_grid*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
